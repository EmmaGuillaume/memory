name: Fid type on files

on:
  push:
    branches: [ develop ]

jobs:
  test-memory-2026:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create empty file and loop on it to find type
        run: |
          for f in $(find . -type f -name "*.*"); do
            cp "$f" empty_file
            file empty_file
          done

  build-memory-2026:
    runs-on: ubuntu-latest
    needs: test-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 .


  push-memory-2026:
    runs-on: ubuntu-latest
    needs: build-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026

  deploy-memory-2026:
    runs-on: ubuntu-latest
    needs: push-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@217.26.206.84 -p 22 "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 && docker run -d -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026"
