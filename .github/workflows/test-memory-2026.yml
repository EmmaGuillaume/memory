name: Fid type on files

on:
  push:
    branches: [ develop ]

jobs:
  test-memory-2026:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create empty file and loop on it to find type
        run: |
          for f in $(find . -type f -name "*.*"); do
            cp "$f" empty_file
            file empty_file
          done

  build-memory-2026:
    runs-on: ubuntu-latest
    needs: test-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 .


  push-memory-2026:
    runs-on: ubuntu-latest
    needs: build-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026

  deploy-memory-2026:
    runs-on: ubuntu-latest
    needs: push-memory-2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        deploy-memory-2026:
  runs-on: ubuntu-latest
  needs: push-memory-2026
  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH and deploy Docker
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/key.pem
        chmod 600 /tmp/key.pem

        ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026 && docker stop memory-2026 || true && docker rm memory-2026 || true && docker run -d --name memory-2026 -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/memory-2026"
